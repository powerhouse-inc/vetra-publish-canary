name: Vetra
on:
  push:
    branches: ['**', '!release-please--**']
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: vetra-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: powerhouse-inc/vetra-publish@v1
        with:
          app-id: 96e56853-7041-4c32-a8f7-e9cc8afb50d4
          # This canary is a staging app.
          vetra-url: https://switchboard.staging.vetra.io
